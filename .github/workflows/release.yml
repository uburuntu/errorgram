name: Release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed in both packages (X.Y.Z); or supply a tag"
        type: string
        default: ""
      tag:
        description: "Optional existing vX.Y.Z tag; must point to this main commit"
        type: string
        default: ""
      registry:
        description: "Registry to publish after approval"
        type: choice
        default: both
        options:
          - both
          - pypi
          - npm
      publish:
        description: "Publish after environment approval (leave false to prepare artifacts)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and prepare distributions
    if: github.ref == 'refs/heads/main' && github.repository == 'uburuntu/errorgram'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and optional tag
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python3 tools/release.py identity
          --version "$RELEASE_VERSION" --tag "$RELEASE_TAG"
          --commit "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: false

      - name: Install dependencies
        run: make setup

      - name: Check catalogue, packages and documentation
        run: make check

      - name: Build distributions
        run: make build

      - name: Test packaged installs
        run: make check-packages

      - name: Prepare registry artifacts
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: >-
          python3 tools/release.py stage --version "$RELEASE_VERSION"
          --commit "$GITHUB_SHA" --output .cache/release

      - name: Record release contents
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          {
            printf '## Errorgram %s\n\n' "$RELEASE_VERSION"
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf 'Publication requested: **%s**.\n\n' "$PUBLISH_REQUESTED"
            printf 'The artifact contains separate PyPI/npm directories and SHA-256 hashes.\n\n'
            printf '```json\n'
            cat .cache/release/manifest.json
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: errorgram-release-${{ github.sha }}
          path: .cache/release/
          if-no-files-found: error
          retention-days: 30

  pypi:
    name: Publish to PyPI
    needs: prepare
    if: inputs.publish && github.ref == 'refs/heads/main' && inputs.registry != 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/errorgram/
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: errorgram-release-${{ github.sha }}
          path: .cache/release/

      - name: Verify artifact identity and hashes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          python3 tools/release.py verify --directory .cache/release
          --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"

      - name: Publish Python distributions through OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: .cache/release/pypi/

  npm:
    name: Publish to npm
    needs: prepare
    if: inputs.publish && github.ref == 'refs/heads/main' && inputs.registry != 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/errorgram
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: errorgram-release-${{ github.sha }}
          path: .cache/release/

      - name: Verify artifact identity and hashes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          python3 tools/release.py verify --directory .cache/release
          --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"

      - name: Publish the npm tarball through OIDC
        working-directory: js
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          npm publish "$GITHUB_WORKSPACE/.cache/release/npm/errorgram-$RELEASE_VERSION.tgz"
          --access public --ignore-scripts --provenance
